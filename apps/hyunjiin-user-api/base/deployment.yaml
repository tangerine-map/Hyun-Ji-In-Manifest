apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyunjiin-user-api
  namespace: hyunjiin
  labels:
    app: hyunjiin-user-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hyunjiin-user-api
  template:
    metadata:
      labels:
        app: hyunjiin-user-api
    spec:
      containers:
        - name: user-api
          image: ghcr.io/tangerine-map/hyunjiin-user-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hyunjiin-user-api-config
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: hyunjiin-user-api-secret
                  key: spring-datasource-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hyunjiin-user-api-secret
                  key: spring-datasource-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hyunjiin-user-api-secret
                  key: spring-datasource-password
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
